<style>

  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
  main { max-width: 440px; padding: 24px 16px; }
  h1 { font-size: 32px; line-height: 1.1; letter-spacing: -0.02em; margin: 0 0 12px; }
  p { color: var(--muted); margin: 0 0 24px; }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; }
  a.btn { display: inline-block; padding: 12px 20px; border-radius: 999px; text-decoration: none; font-weight: 500; }
  a.fill { background: var(--fg); color: var(--bg); }
  a.line { color: var(--fg); box-shadow: inset 0 0 0 1px var(--muted); }
</style>
</head>
